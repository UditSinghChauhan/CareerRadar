name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerradar_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test Backend
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/careerradar_test
          CLERK_SECRET_KEY: sk_test_placeholder
          CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NODE_ENV: test

      - name: Test Frontend
        run: pnpm --filter @workspace/career-radar run test

      - name: Build
        run: pnpm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder

  # A job's `if` cannot read secrets, so this one does and says what it found.
  # A fork's pull request gets no secrets: the E2E job is then skipped with a
  # notice instead of failing on a missing key.
  e2e-secrets:
    name: E2E · secrets check
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          PUBLISHABLE: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
          SECRET: ${{ secrets.CLERK_SECRET_KEY_TEST }}
        run: |
          if [ -n "$PUBLISHABLE" ] && [ -n "$SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E skipped::CLERK_PUBLISHABLE_KEY_TEST and CLERK_SECRET_KEY_TEST are not available to this run (a fork's pull request, or the secrets are unset), so the Playwright job did not run."
          fi

  e2e:
    name: E2E · Playwright (Chromium)
    needs: e2e-secrets
    if: needs.e2e-secrets.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerradar_e2e
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The suite refuses a non-local database and a non-sk_test_ Clerk key
      # (e2e/global-setup.ts). The keys belong to the Clerk development
      # instance; its +clerk_test user never receives mail.
      DATABASE_URL: postgresql://test:test@localhost:5432/careerradar_e2e
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # A fresh service container every run, so --force has nothing to drop.
      - name: Schema and seed data
        run: |
          pnpm --filter @workspace/db run push-force
          pnpm --filter @workspace/api-server run seed

      - name: E2E suite
        run: pnpm run test:e2e

      - name: Build the landing
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/career-radar run build

      - name: Landing E2E suite
        if: ${{ !cancelled() }}
        run: |
          pnpm --filter @workspace/career-radar exec vite preview --port 5198 --strictPort > "$RUNNER_TEMP/landing-preview.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:5198/ > /dev/null && break
            sleep 1
          done
          pnpm run test:landing

      - name: Upload Playwright reports and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            test-results
            e2e-landing/.report
            e2e-landing/.results
          retention-days: 14
          if-no-files-found: ignore
