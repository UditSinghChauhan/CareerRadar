name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: careerradar_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test Backend
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/careerradar_test
          CLERK_SECRET_KEY: sk_test_placeholder
          CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          NODE_ENV: test

      - name: Test Frontend
        run: pnpm --filter @workspace/career-radar run test

      - name: Build
        run: pnpm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
