# CareerRadar sync — the external scheduler.
#
# Render's free tier has no cron jobs and no background workers, and free web
# services spin down after 15 minutes idle, killing the in-process setInterval
# scheduler with them. This workflow is what actually makes sync happen in
# production. It is copied from section C of CAREERRADAR_PHASE0_SETUP.md, which
# supersedes UPGRADE.md §5.1.
#
# The two-step shape is deliberate: the first request after a spin-down takes
# 30–60 seconds, so a naive single curl times out and the job looks broken.
# Step one absorbs the cold start and is allowed to fail; step two does the work.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   CAREERRADAR_URL   https://careerradar-34ec.onrender.com
#   SYNC_CRON_SECRET  must match SYNC_CRON_SECRET in the Render environment
name: CareerRadar sync
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Tolerates a cold start (connection refused / timeout after retries) but
      # NOT a 503: that is the schema drift check saying the code expects columns
      # the database does not have. A sync against that schema fails on the
      # first INSERT, so fail here, loudly, with the columns and the fix in the
      # body. `|| true` on the whole curl used to swallow exactly this.
      - name: Wake the service (cold start tolerated, schema drift is not)
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --max-time 120 --retry 3 --retry-all-errors --retry-delay 20 \
            "${{ secrets.CAREERRADAR_URL }}/api/health" || echo "000")
          echo "GET /api/health → HTTP $code"
          cat /tmp/health.json 2>/dev/null; echo
          if [ "$code" = "503" ]; then
            echo "::error::Schema drift on production — the migration in lib/db/sql/ has not been applied. See the body above."
            exit 1
          fi
          # Anything else (000 = still asleep, 200 = fine) falls through to the trigger.

      - name: Trigger sync
        run: |
          curl -sS -X POST \
            --max-time 120 --retry 2 --retry-all-errors --retry-delay 15 \
            -H "x-cron-secret: ${{ secrets.SYNC_CRON_SECRET }}" \
            -H "content-type: application/json" \
            --fail-with-body \
            "${{ secrets.CAREERRADAR_URL }}/api/sync/cron"
