openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: CareerRadar API — personal placement OS for CS students
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile management
  - name: settings
    description: User settings management
  - name: dashboard
    description: Dashboard summary and stats
  - name: companies
    description: Company directory
  - name: jobs
    description: Job listings
  - name: applications
    description: User job applications
  - name: bookmarks
    description: Bookmarked jobs
  - name: saved-searches
    description: Saved search filters
  - name: notifications
    description: Deadline reminders and new-job alerts
  - name: ai
    description: AI-powered matching and recommendations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: >-
            Schema drift — the code expects columns the database does not
            have. The body lists them per table and names the migration to
            apply. Callers that tolerate a cold start must still treat this
            as a failure.

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user's profile
      security:
        - clerkAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update current user's profile
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Unauthorized

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get current user's settings
      security:
        - clerkAuth: []
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          description: Unauthorized
    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update current user's settings
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          description: Unauthorized

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized

  /dashboard/today:
    get:
      operationId: getDailyQueue
      tags: [dashboard]
      summary: Today's apply queue — ranked jobs to act on now
      description: >-
        Phase 3.1. Active, fresher-eligible jobs the user has neither applied
        to nor dismissed, ranked by
        `relevanceScore*0.40 + deadlineUrgency*0.30 + freshness*0.20 +
        dreamCompanyBoost*0.10`, with duplicate listings collapsed by
        (company, normalised title) keeping the highest-priority instance.


        Each item carries its components and a plain-language reason per
        component, computed server-side — the frontend must not recompute the
        ranking.


        Rows whose priority is identical are ordered by a deterministic
        per-day shuffle (see `queueDay`): stable within a day, rotating
        between days. Measured on the live table, the top ten all score
        exactly 63.00, so without this the same ten win every day and the
        other ~610 equally-relevant rows are never shown.
      security:
        - clerkAuth: []
      parameters:
        - in: query
          name: limit
          description: >-
            How many rows to return, 1–50. Defaults to 10, which is also the
            default daily target.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The ranked queue plus today's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyQueue"
        "401":
          description: Unauthorized

  # ─── Companies ────────────────────────────────────────────────────────────────

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List all companies
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: industry
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated company list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get a company by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found

  # ─── Jobs ─────────────────────────────────────────────────────────────────────

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs with filters
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: companyId
          schema:
            type: string
        - in: query
          name: workMode
          schema:
            type: string
            enum: [remote, hybrid, onsite]
        - in: query
          name: jobType
          schema:
            type: string
            enum: [internship, full_time]
        - in: query
          name: status
          schema:
            type: string
            enum: [active, closed, draft]
        - in: query
          name: eligibleBatch
          schema:
            type: integer
        - in: query
          name: minCgpaLte
          schema:
            type: number
        - in: query
          name: deadlineBefore
          schema:
            type: string
            format: date
        - in: query
          name: isIndia
          description: >-
            Phase 2.0. Only rows whose normalised location is (true) or is not
            (false) in India. Rows the normaliser could not place (isIndia null)
            never match either value — select the `unknown` bucket in
            `locations` to see them.
          schema:
            type: boolean
        - in: query
          name: isRemote
          description: Phase 2.0. Only rows whose location carries a remote marker.
          schema:
            type: boolean
        - in: query
          name: locations
          description: >-
            Phase 2.0 location buckets, OR-ed together; omit for no location
            filtering. A metro name (NCR, MMR, Bengaluru, Hyderabad, Pune,
            Chennai, Kolkata, or any other locationMetro value) matches that
            metro exactly. `remote` = remote roles not scoped to another country.
            `other_india` = India rows naming a city outside the seven featured
            metros. `india_unspecified` = India rows that state no city at
            all (bare 'India') — not "elsewhere", just unstated. `unknown` =
            rows the normaliser could not
            place — kept reviewable rather than hidden. Filtering is
            server-side; the list is bounded, so nothing is filtered in the
            browser.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: isFresherEligible
          description: >-
            Phase 2.1. Only rows the relevance classifier put on the internship,
            new_grad or early_career track (true) or ruled out (false). Rows
            not yet classified count as false. Omit for no relevance filtering
            — the pre-2.1 behaviour exactly.
          schema:
            type: boolean
        - in: query
          name: relevanceTrack
          description: >-
            Phase 2.1 tracks, OR-ed together. Unclassified rows never match.
          schema:
            type: array
            items:
              type: string
              enum: [internship, new_grad, early_career, not_relevant]
          style: form
          explode: true
        - in: query
          name: minRelevanceScore
          description: Phase 2.1. Only rows scoring at least this (0–100).
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - in: query
          name: showDismissed
          description: >-
            Phase 3.2. By default a signed-in caller's dismissed jobs are
            hidden; set true to see them again. Ignored for an anonymous
            caller, who has no dismissals — the list is then exactly the
            pre-3.2 one.
          schema:
            type: boolean
            default: false
        - in: query
          name: workModes
          description: >-
            Phase 7. Work modes OR-ed together; omit for no work-mode
            filtering. Distinct from the single-valued `workMode` above, which
            is unchanged. Previously applied in the browser over the fetched
            window, which is why it could disagree with the result count.
          schema:
            type: array
            items:
              type: string
              enum: [remote, hybrid, onsite]
          style: form
          explode: true
        - in: query
          name: batches
          description: >-
            Phase 7. Graduation years OR-ed together. A posting that names NO
            eligible batch matches any of them — most postings name none, and
            hiding those would empty the list.
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        - in: query
          name: branches
          description: >-
            Phase 7. Branches OR-ed together. Same "names none matches
            anything" rule as `batches`.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: skills
          description: >-
            Phase 7. Required skills OR-ed together. Unlike `batches` and
            `branches` there is NO empty-allowance: a posting that lists no
            skills matches nothing here.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - in: query
          name: sourcePlatform
          description: Phase 7. Exact match on the provider a posting came from.
          schema:
            type: string
        - in: query
          name: hideApplied
          description: >-
            Phase 7. Hide rows the signed-in caller already has an application
            for, in any pipeline stage. Ignored for an anonymous caller, who
            has no applications.
          schema:
            type: boolean
            default: false
        - in: query
          name: sort
          description: >-
            `newest` (default, the pre-2.1 order — posted date desc),
            `relevance` (Phase 2.1 — relevanceScore desc, unclassified last,
            newest first among equal scores), or the Phase 7 additions:
            `deadline` (soonest first, no deadline last), `salary` (the best of
            salaryMax / salaryMin / stipend, highest first) and `company`
            (company name, A–Z). The last three were browser-side sorts over
            the fetched window before Phase 7 and so only ever ordered part of
            the result set.
          schema:
            type: string
            enum: [newest, relevance, deadline, salary, company]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          description: >-
            Rows per page. Phase 7 raised the server-side cap from 100 to 200;
            a larger value is clamped rather than rejected.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Paginated job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/capture:
    post:
      operationId: captureJob
      tags: [jobs]
      summary: Parse a pasted job posting into an editable draft
      description: >-
        Phase 4.1. The user pastes a URL and, optionally, the job description
        text they copied. The server parses WHAT IT WAS GIVEN — it never
        requests the posting's own site, which is the whole point of the
        feature: LinkedIn, Naukri, Internshala, Unstop and Wellfound prohibit
        automated extraction.


        When `GEMINI_API_KEY` is configured the text goes to Gemini for
        structured extraction; when it is not, deterministic heuristics read
        the text and the URL slug instead. Both paths return the same shape,
        and the response ALWAYS a draft — nothing is written until
        `POST /jobs/capture/confirm`.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCaptureInput"
      responses:
        "200":
          description: A draft for the user to confirm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCaptureResponse"
        "400":
          description: Neither a url nor rawText was supplied
        "401":
          description: Unauthorized

  /jobs/capture/confirm:
    post:
      operationId: confirmCapturedJob
      tags: [jobs]
      summary: Save a confirmed capture draft as a job
      description: >-
        Phase 4.1. Creates the job from the draft the user edited. The company
        is resolved by name and created if new. The §2.0 location normaliser
        and the §2.1 relevance classifier both run, and `sourcePlatform` is set
        to `manual` server-side — it is never taken from the request.


        If a job with the same `sourceUrl` already exists the existing row is
        returned with `duplicate: true` rather than a second copy being made.
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCaptureConfirmInput"
      responses:
        "201":
          description: The created (or already-existing) job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobCaptureResult"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /jobs/deadlines/soon:
    get:
      operationId: getJobsClosingSoon
      tags: [jobs]
      summary: Get jobs closing within N days
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Jobs closing soon
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a job by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
    put:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdateInput"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Close/deactivate a job listing
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}/dismiss:
    post:
      operationId: dismissJob
      tags: [jobs]
      summary: Hide a job from the queue and the jobs list
      description: >-
        Phase 3.2. A hide, never a delete — the job row is untouched and
        DELETE restores it. Idempotent: dismissing twice returns the first
        dismissal rather than creating a second.
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissJobInput"
      responses:
        "201":
          description: The dismissal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDismissal"
        "401":
          description: Unauthorized
        "404":
          description: Job not found
        "409":
          description: The signed-in user has no profile row yet
    delete:
      operationId: restoreDismissedJob
      tags: [jobs]
      summary: Undo a dismissal
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dismissal removed
        "401":
          description: Unauthorized
        "404":
          description: The job was not dismissed

  # ─── Applications ─────────────────────────────────────────────────────────────

  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List user's applications
      security:
        - clerkAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                saved,
                applied,
                oa_pending,
                oa_completed,
                interview_pending,
                interview_completed,
                offered,
                rejected,
                withdrawn,
              ]
        - in: query
          name: jobType
          schema:
            type: string
            enum: [internship, full_time]
        - in: query
          name: awaitingFollowUp
          description: >
            Phase 6.1. When true, returns only applications whose follow-up date
            has arrived (`followUpDate <= now()`) and whose status is not
            terminal. Only `rejected` and `withdrawn` are excluded, because only
            they mean the company can do nothing further. `offered` is NOT
            excluded: an unanswered offer has an accept-by date and a pipeline
            of other applications to update, so it needs chasing more than any
            other state. Rows with no follow-up date never match. Absent or
            false = no filtering, the pre-6.1 behaviour.
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated application list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: createApplication
      tags: [applications]
      summary: Create an application
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Created application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized

  # Declared before /applications/{id} so the literal path wins over the
  # path parameter when a router matches routes in declaration order.
  /applications/status-map:
    get:
      operationId: getApplicationStatusMap
      tags: [applications]
      summary: Map of jobId to application status for the current user
      description: >
        Returns every job the authenticated user has an application row for,
        keyed by job ID. Used by the jobs list to avoid offering a clean Apply
        button for something already applied to.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Job ID to application status map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusMap"
        "401":
          description: Unauthorized

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application by ID
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    put:
      operationId: updateApplication
      tags: [applications]
      summary: Update application status or notes
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateInput"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteApplication
      tags: [applications]
      summary: Delete an application
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ─── Notifications ────────────────────────────────────────────────────────────
  #
  # Phase 6.2. Rows are written by the generator that runs after every
  # POST /api/sync/cron pass (deadline reminders at 72h and 24h, new-job alerts
  # against saved searches); nothing here creates one. These three routes are
  # the read and acknowledge side, which is all the bell needs.

  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List the current user's notifications, newest first
      description: >
        `unreadCount` is returned alongside the page rather than from a separate
        endpoint, because the bell needs the badge and the list together and a
        free-tier instance should not answer two round trips for one popover.
        It counts every unread notification the user has, not just those on this
        page, and is unaffected by `unreadOnly`.
      security:
        - clerkAuth: []
      parameters:
        - in: query
          name: unreadOnly
          description: When true, returns only notifications that are not yet read.
          schema:
            type: boolean
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated notification list plus the total unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: clearNotifications
      tags: [notifications]
      summary: Delete all of the current user's notifications
      description: >
        The "Clear all" control in the bell. Not in UPGRADE.md §6.2, which
        specifies only list / mark-read / mark-all-read — added because without
        it the table only ever grows: rows are generated on a schedule and
        there is no retention sweep, so "read" alone would leave the popover
        accumulating every deadline of the season. Deletes only the caller's
        own rows.
      security:
        - clerkAuth: []
      responses:
        "200":
          description: How many rows were deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsDeletedResult"
        "401":
          description: Unauthorized

  # Declared before /notifications/{id}/read so the literal path wins over the
  # path parameter when a router matches routes in declaration order. The two
  # do not actually collide (different segment counts), but the ordering
  # matches how /applications/status-map is handled and survives a later edit.
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark every unread notification as read
      security:
        - clerkAuth: []
      responses:
        "200":
          description: How many rows were marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationsReadResult"
        "401":
          description: Unauthorized

  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      description: >
        Idempotent — marking an already-read notification returns it unchanged
        with a 200, because the bell fires this on click and a double click is
        not an error.
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ─── Bookmarks ────────────────────────────────────────────────────────────────

  /bookmarks:
    get:
      operationId: listBookmarks
      tags: [bookmarks]
      summary: List user's bookmarked jobs
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Bookmarked jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized
    post:
      operationId: createBookmark
      tags: [bookmarks]
      summary: Bookmark a job
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkInput"
      responses:
        "201":
          description: Bookmark created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bookmark"
        "401":
          description: Unauthorized

  /bookmarks/{jobId}:
    delete:
      operationId: deleteBookmark
      tags: [bookmarks]
      summary: Remove a bookmark
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized

  # ─── Saved Searches ───────────────────────────────────────────────────────────

  /saved-searches:
    get:
      operationId: listSavedSearches
      tags: [saved-searches]
      summary: List user's saved searches
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized
    post:
      operationId: createSavedSearch
      tags: [saved-searches]
      summary: Save a search
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedSearchInput"
      responses:
        "201":
          description: Saved search created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedSearch"
        "401":
          description: Unauthorized

  /saved-searches/{id}:
    delete:
      operationId: deleteSavedSearch
      tags: [saved-searches]
      summary: Delete a saved search
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized

  # ─── AI Matching ──────────────────────────────────────────────────────────────

  /ai/status:
    get:
      operationId: getAIStatus
      tags: [ai]
      summary: Check if AI matching features are available
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AIStatus"

  /ai/jobs/{id}/match:
    get:
      operationId: getJobMatchScore
      tags: [ai]
      summary: Get AI match score between user profile and a job
      security:
        - clerkAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Match score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMatchScore"
        "401":
          description: Unauthorized
        "404":
          description: Job or profile not found
        "503":
          description: AI matching not configured

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer

  schemas:
    # ─── AI ──────────────────────────────────────────────────────────────────────

    AIStatus:
      type: object
      required: [available, provider]
      properties:
        available:
          type: boolean
        provider:
          type: string
        description:
          type: string

    JobMatchScore:
      type: object
      required:
        [jobId, score, summary, matchingSkills, missingSkills, recommendations]
      properties:
        jobId:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        summary:
          type: string
        matchingSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string

    # ─── Shared ─────────────────────────────────────────────────────────────────

    HealthStatus:
      type: object
      properties:
        status:
          type: string
        schema:
          description: >-
            Result of the boot-time schema drift check: `ok`, or `unchecked`
            when the database could not be reached. A drifted schema is not
            a 200 at all — see the 503 response.
          type: string
      required: [status]

    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    # ─── Profile & Settings ─────────────────────────────────────────────────────

    Profile:
      type: object
      required: [id, clerkId, name, email, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        name:
          type: string
        email:
          type: string
        college:
          type: ["string", "null"]
        degree:
          type: ["string", "null"]
        branch:
          type: ["string", "null"]
        graduationYear:
          type: ["integer", "null"]
        cgpa:
          type: ["number", "null"]
        skills:
          type: array
          items:
            type: string
        resumeUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        githubUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    ProfileInput:
      type: object
      properties:
        name:
          type: string
        college:
          type: string
        degree:
          type: string
        branch:
          type: string
        graduationYear:
          description: Null clears it.
          type: ["integer", "null"]
        cgpa:
          type: number
        skills:
          type: array
          items:
            type: string
        resumeUrl:
          type: string
        linkedinUrl:
          type: string
        githubUrl:
          type: string

    Settings:
      type: object
      required: [id, clerkId, emailNotifications, theme]
      properties:
        id:
          type: string
        clerkId:
          type: string
        emailNotifications:
          type: boolean
        deadlineAlertDays:
          type: integer
        dailyApplicationTarget:
          description: >-
            Phase 3.3. How many applications Today's Queue asks for per day.
            Default 10.
          type: integer
          minimum: 1
          maximum: 100
        theme:
          type: string
          enum: [light, dark, system]
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SettingsInput:
      type: object
      properties:
        emailNotifications:
          type: boolean
        deadlineAlertDays:
          type: integer
        dailyApplicationTarget:
          type: integer
          minimum: 1
          maximum: 100
        theme:
          type: string
          enum: [light, dark, system]
        timezone:
          type: string

    DashboardSummary:
      type: object
      required:
        [
          totalApplications,
          appliedCount,
          upcomingDeadlines,
          recentActivity,
          profileCompleteness,
        ]
      properties:
        totalApplications:
          type: integer
        appliedCount:
          type: integer
        upcomingDeadlines:
          type: integer
        recentActivity:
          type: integer
        profileCompleteness:
          type: integer
        bookmarksCount:
          type: integer
        activeJobsCount:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer

    # ─── Daily queue (Phase 3) ──────────────────────────────────────────────────

    PriorityComponents:
      description: >-
        The four §3.1 components on their own 0–100 scales, before their
        weights. `contributions` on a QueueItem is the same object after
        weighting.
      type: object
      required: [relevanceScore, deadlineUrgency, freshness, dreamCompanyBoost]
      properties:
        relevanceScore:
          description: >-
            The stored relevance score. Saturated in practice — hundreds of
            active rows sit at exactly 100, which is why the other three
            components decide the order.
          type: number
        deadlineUrgency:
          description: >-
            100 within 72h, 80 within 7d, 40 within 30d, 10 with no deadline
            (or one over 30 days out, or already past). Currently 10 for every
            row, because the providers in use publish no deadlines — the
            reason strings say so explicitly rather than implying the term is
            separating anything.
          type: number
        freshness:
          description: 100 for the first 48 hours, then straight down to 0 at 30 days.
          type: number
        dreamCompanyBoost:
          description: 100 when the user has bookmarked a role at this company, else 0.
          type: number

    QueueItem:
      type: object
      required:
        [job, priority, components, contributions, duplicateCount, reasons]
      properties:
        job:
          $ref: "#/components/schemas/Job"
        priority:
          description: The weighted total, 0–100.
          type: number
        components:
          $ref: "#/components/schemas/PriorityComponents"
        contributions:
          $ref: "#/components/schemas/PriorityComponents"
        duplicateCount:
          description: >-
            How many rows collapsed into this one by (company, normalised
            title). 1 means the listing was unique.
          type: integer
        reasons:
          description: One plain-language line per component, in weight order.
          type: array
          items:
            type: string

    DailyProgress:
      type: object
      required: [appliedToday, target, streakDays, timezone]
      properties:
        appliedToday:
          type: integer
        target:
          type: integer
        streakDays:
          description: >-
            Consecutive days with at least one application. A day still in
            progress with none logged does not break it.
          type: integer
        timezone:
          description: The IANA zone every day boundary was evaluated in.
          type: string

    DailyQueue:
      type: object
      required:
        [
          generatedAt,
          queueDay,
          limit,
          eligibleCount,
          distinctCount,
          progress,
          items,
        ]
      properties:
        generatedAt:
          description: The single instant every row was scored against.
          type: string
          format: date-time
        queueDay:
          description: >-
            The local date (YYYY-MM-DD, in `progress.timezone`) whose rotation
            produced this order. Rows that tie on priority are ordered by a
            deterministic per-day shuffle, so the queue is stable within a day
            and rotates between days — without it the same ten rows win
            forever and the rest of the tied block is unreachable.
          type: string
        limit:
          type: integer
        eligibleCount:
          description: Rows that passed every exclusion, before duplicate collapse.
          type: integer
        distinctCount:
          description: Distinct (company, normalised title) groups among those rows.
          type: integer
        queryMs:
          type: integer
        progress:
          $ref: "#/components/schemas/DailyProgress"
        weights:
          description: The §3.1 weights the server applied, echoed for the UI.
          type: object
          additionalProperties:
            type: number
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"

    DismissJobInput:
      type: object
      properties:
        reason:
          description: Optional free text. Null or absent = dismissed without a reason.
          type: ["string", "null"]
          maxLength: 500

    JobDismissal:
      type: object
      required: [id, profileId, jobId, createdAt]
      properties:
        id:
          type: string
        profileId:
          type: string
        jobId:
          type: string
        reason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    JobCaptureInput:
      type: object
      properties:
        url:
          description: The posting's URL. Parsed as a string; never requested.
          type: ["string", "null"]
          maxLength: 2000
        rawText:
          description: >-
            The job description the user copied. Optional — a URL alone still
            yields a partial draft on the boards that encode the role in the
            path.
          type: ["string", "null"]
          maxLength: 40000

    JobCaptureDraft:
      type: object
      required:
        [
          title,
          companyName,
          location,
          workMode,
          jobType,
          stipend,
          salaryMin,
          salaryMax,
          currency,
          deadline,
          requiredSkills,
          description,
          applyUrl,
          sourceUrl,
        ]
      properties:
        title:
          type: ["string", "null"]
        companyName:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        workMode:
          type: ["string", "null"]
          enum: [remote, hybrid, onsite, null]
        jobType:
          type: ["string", "null"]
          enum: [internship, full_time, null]
        stipend:
          description: Monthly, in `currency`.
          type: ["integer", "null"]
        salaryMin:
          description: Annual, in `currency`.
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        currency:
          type: string
        deadline:
          type: ["string", "null"]
          format: date-time
        requiredSkills:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        applyUrl:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]

    JobCaptureResponse:
      type: object
      required: [draft, source, aiAvailable, platform, warnings]
      properties:
        draft:
          $ref: "#/components/schemas/JobCaptureDraft"
        source:
          description: >-
            `gemini` only when the model actually returned a usable object;
            `heuristic` whenever the deterministic parsers produced the draft.
          type: string
          enum: [gemini, heuristic]
        aiAvailable:
          description: Whether GEMINI_API_KEY is configured on this server at all.
          type: boolean
        platform:
          description: Display label derived from the URL's host, e.g. "LinkedIn".
          type: ["string", "null"]
        warnings:
          description: Things to tell the user before they save.
          type: array
          items:
            type: string

    JobCaptureConfirmInput:
      type: object
      required: [title, companyName]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        companyName:
          description: Resolved to a company by slug; created if it does not exist.
          type: string
          minLength: 1
          maxLength: 200
        location:
          type: ["string", "null"]
        workMode:
          type: ["string", "null"]
          enum: [remote, hybrid, onsite, null]
        jobType:
          type: ["string", "null"]
          enum: [internship, full_time, null]
        stipend:
          type: ["integer", "null"]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        currency:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
          format: date-time
        requiredSkills:
          type: array
          items:
            type: string
        description:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        applyUrl:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]

    JobCaptureResult:
      type: object
      required: [job, duplicate]
      properties:
        job:
          $ref: "#/components/schemas/Job"
        duplicate:
          description: >-
            True when a job with this sourceUrl already existed and is being
            returned instead of a new row.
          type: boolean

    # ─── Company ────────────────────────────────────────────────────────────────

    Company:
      type: object
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        headquarters:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
          enum: [startup, small, medium, large, enterprise, null]
        type:
          type: ["string", "null"]
          enum: [product, service, consulting, startup, null]
        linkedinUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    CompanyInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
        website:
          type: string
        industry:
          type: string
        description:
          type: string
        headquarters:
          type: string
        size:
          type: string
          enum: [startup, small, medium, large, enterprise]
        type:
          type: string
          enum: [product, service, consulting, startup]
        linkedinUrl:
          type: string

    CompanyListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ─── Job Source ─────────────────────────────────────────────────────────────

    JobSource:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        baseUrl:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    # ─── Job ────────────────────────────────────────────────────────────────────

    Job:
      type: object
      required: [id, companyId, title, jobType, workMode, status, createdAt]
      properties:
        id:
          type: string
        companyId:
          type: string
        sourceId:
          type: ["string", "null"]
        title:
          type: string
        department:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        country:
          description: >-
            Unreliable — the schema default writes 'India' whenever a provider
            omits it. Kept for compatibility; use isIndia / locationCountry.
          type: ["string", "null"]
        locationCity:
          description: Phase 2.0 normalised city, e.g. 'Bengaluru'. Null when unknown.
          type: ["string", "null"]
        locationRegion:
          description: Phase 2.0 normalised state/province, full name. Null when unknown.
          type: ["string", "null"]
        locationCountry:
          description: Phase 2.0 uppercase ISO-2. Null when unknown.
          type: ["string", "null"]
        locationMetro:
          description: "Phase 2.0 metro bucket: 'NCR', 'MMR', or the city itself."
          type: ["string", "null"]
        isIndia:
          description: >-
            Phase 2.0 three-valued: true, false (names another country), or
            null (the location could not be placed — kept reviewable).
          type: ["boolean", "null"]
        isRemote:
          description: Phase 2.0. The location carries a remote marker.
          type: boolean
        relevanceTrack:
          description: >-
            Phase 2.1 classifier verdict. Null until the row has been
            classified (the relevance backfill has not run yet).
          type: ["string", "null"]
          enum: [internship, new_grad, early_career, not_relevant, null]
        relevanceScore:
          description: Phase 2.1. 0–100; 0 for not_relevant; null until classified.
          type: ["integer", "null"]
        isFresherEligible:
          description: Phase 2.1. True for every track except not_relevant. False until classified.
          type: boolean
        seniorityExcluded:
          description: Phase 2.1. A seniority/level/years marker ruled the row out.
          type: boolean
        relevanceSignals:
          description: >-
            Phase 2.1. Human-readable reasons behind the track and score, in
            the order they fired — shown on hover so a wrong verdict can be
            debugged without opening the database.
          type: array
          items:
            type: string
        classifiedAt:
          type: ["string", "null"]
          format: date-time
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        jobType:
          type: string
          enum: [internship, full_time]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        stipend:
          type: ["integer", "null"]
        currency:
          type: string
        eligibleBatch:
          type: array
          items:
            type: integer
        eligibleBranches:
          type: array
          items:
            type: string
        minCgpa:
          type: ["number", "null"]
        requiredSkills:
          type: array
          items:
            type: string
        experienceMin:
          type: ["integer", "null"]
        experienceMax:
          type: ["integer", "null"]
        deadline:
          type: ["string", "null"]
          format: date-time
        applyUrl:
          type: ["string", "null"]
        sourcePlatform:
          type: ["string", "null"]
        sourceUrl:
          type: ["string", "null"]
        postedDate:
          type: ["string", "null"]
          format: date-time
        status:
          type: string
          enum: [active, closed, draft]
        lastSeenAt:
          description: >-
            Last time a provider run observed this posting in its upstream
            listing. Null for rows never covered by a sweep. Internal staleness
            bookkeeping — clients should not branch on it.
          type: ["string", "null"]
          format: date-time
        description:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        benefits:
          type: array
          items:
            type: string
        selectionProcess:
          type: ["string", "null"]
        company:
          $ref: "#/components/schemas/Company"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    JobInput:
      type: object
      required: [companyId, title, jobType, workMode]
      properties:
        companyId:
          type: string
        sourceId:
          type: string
        title:
          type: string
        department:
          type: string
        location:
          type: string
        country:
          type: string
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        jobType:
          type: string
          enum: [internship, full_time]
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        stipend:
          type: integer
        currency:
          type: string
        eligibleBatch:
          type: array
          items:
            type: integer
        eligibleBranches:
          type: array
          items:
            type: string
        minCgpa:
          type: number
        requiredSkills:
          type: array
          items:
            type: string
        experienceMin:
          type: integer
        experienceMax:
          type: integer
        deadline:
          type: string
          format: date-time
        applyUrl:
          type: string
        sourcePlatform:
          type: string
        sourceUrl:
          type: string
        postedDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, closed, draft]
        description:
          type: string
        requirements:
          type: string
        benefits:
          type: array
          items:
            type: string
        selectionProcess:
          type: string

    JobUpdateInput:
      type: object
      properties:
        title:
          type: string
        department:
          type: string
        location:
          type: string
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        jobType:
          type: string
          enum: [internship, full_time]
        salaryMin:
          type: integer
        salaryMax:
          type: integer
        stipend:
          type: integer
        eligibleBatch:
          type: array
          items:
            type: integer
        eligibleBranches:
          type: array
          items:
            type: string
        minCgpa:
          type: number
        requiredSkills:
          type: array
          items:
            type: string
        deadline:
          type: string
          format: date-time
        applyUrl:
          type: string
        status:
          type: string
          enum: [active, closed, draft]
        description:
          type: string
        requirements:
          type: string
        benefits:
          type: array
          items:
            type: string
        selectionProcess:
          type: string

    JobListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ─── Application ─────────────────────────────────────────────────────────────

    Application:
      type: object
      required: [id, clerkId, jobId, status, referralStatus, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        jobId:
          type: string
        status:
          type: string
          enum:
            [
              saved,
              applied,
              oa_pending,
              oa_completed,
              interview_pending,
              interview_completed,
              offered,
              rejected,
              withdrawn,
            ]
        appliedDate:
          type: ["string", "null"]
          format: date-time
        notes:
          type: ["string", "null"]
        resumeVersion:
          type: ["string", "null"]
        # Phase 6.1 calls this field `contactName`: the person being asked for
        # the referral. The column predates the phase under this name and is
        # reused rather than duplicated — see lib/db/src/schema/applications.ts.
        referralName:
          type: ["string", "null"]
        contactUrl:
          description: The contact's LinkedIn (or any) profile URL.
          type: ["string", "null"]
        referralStatus:
          description: >
            Phase 6.1. Never null — every row defaults to "none", meaning the
            referral has not been asked for.
          type: string
          enum: [none, requested, received, declined]
        outreachNotes:
          type: ["string", "null"]
        # Phase 6.1 calls this `followUpAt`. Reused under its existing name.
        followUpDate:
          type: ["string", "null"]
          format: date-time
        offerAmount:
          type: ["integer", "null"]
        job:
          $ref: "#/components/schemas/Job"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    ApplicationInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            [
              saved,
              applied,
              oa_pending,
              oa_completed,
              interview_pending,
              interview_completed,
              offered,
              rejected,
              withdrawn,
            ]
        appliedDate:
          type: string
          format: date-time
        notes:
          type: string
        resumeVersion:
          type: string
        referralName:
          type: string
        contactUrl:
          type: string
        referralStatus:
          type: string
          enum: [none, requested, received, declined]
        outreachNotes:
          type: string

    ApplicationUpdateInput:
      type: object
      description: >
        Every field is optional; only the ones present are written. The
        clearable text and date fields accept an explicit null, which is how
        the drawer erases a value it previously set. Without that, a follow-up
        date could be set but never unset, and Phase 6.1's "Awaiting
        follow-up" filter would surface the row forever.
      properties:
        status:
          type: string
          enum:
            [
              saved,
              applied,
              oa_pending,
              oa_completed,
              interview_pending,
              interview_completed,
              offered,
              rejected,
              withdrawn,
            ]
        notes:
          type: ["string", "null"]
        resumeVersion:
          type: ["string", "null"]
        referralName:
          type: ["string", "null"]
        contactUrl:
          type: ["string", "null"]
        referralStatus:
          type: string
          enum: [none, requested, received, declined]
        outreachNotes:
          type: ["string", "null"]
        followUpDate:
          type: ["string", "null"]
          format: date-time
        appliedDate:
          type: ["string", "null"]
          format: date-time
        offerAmount:
          type: ["integer", "null"]

    ApplicationStatusMap:
      type: object
      description: Job ID keyed map of the current user's application statuses.
      additionalProperties:
        type: string
        enum:
          [
            saved,
            applied,
            oa_pending,
            oa_completed,
            interview_pending,
            interview_completed,
            offered,
            rejected,
            withdrawn,
          ]

    ApplicationListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    # ─── Bookmark ───────────────────────────────────────────────────────────────

    Bookmark:
      type: object
      required: [id, clerkId, jobId, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        jobId:
          type: string
        job:
          $ref: "#/components/schemas/Job"
        createdAt:
          type: string
          format: date-time

    BookmarkInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string

    # ─── Saved Search ────────────────────────────────────────────────────────────

    SavedSearch:
      type: object
      required: [id, clerkId, name, filters, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        name:
          type: string
        filters:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    SavedSearchInput:
      type: object
      required: [name, filters]
      properties:
        name:
          type: string
        filters:
          type: object
          additionalProperties: true

    # ─── Notification ───────────────────────────────────────────────────────────

    Notification:
      type: object
      required: [id, clerkId, title, message, type, isRead, createdAt]
      properties:
        id:
          type: string
        clerkId:
          type: string
        title:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [deadline_reminder, new_job, status_update, system]
        isRead:
          type: boolean
        relatedJobId:
          type: ["string", "null"]
        metadata:
          type: ["object", "null"]
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    NotificationListResponse:
      type: object
      required: [data, meta, unreadCount]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        unreadCount:
          description: >
            Total unread notifications for the user, across all pages and
            regardless of the `unreadOnly` filter. This is the bell's badge.
          type: integer

    NotificationsReadResult:
      type: object
      required: [updated]
      properties:
        updated:
          description: How many rows changed from unread to read.
          type: integer

    NotificationsDeletedResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          description: How many notifications were removed.
          type: integer
